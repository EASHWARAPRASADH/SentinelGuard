[project]
name = "sentinelguard"
version = "0.1.0"
description = "SentinelGuard: State-Aware Policy Verification for Safe AI-Driven Cloud Incident Response"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "networkx>=3.2.0",
    "pytest>=8.2.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelguard"]

